{% extends "base.html" %}
{% block title %}Настройки предпочтений — Попутка ИИ{% endblock %}
{% block content %}
<h2 class="mb-4">Настройки предпочтений</h2>

<div class="row">
    <div class="col-md-6">
        <div class="card mb-3">
            <div class="card-header">
                <h5 class="mb-0">QoL предпочтения</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('users.preferences') }}">
                    <div class="mb-3">
                        <label for="music_pref" class="form-label">Музыка</label>
                        <select class="form-select" id="music_pref" name="music_pref">
                            <option value="neutral" {% if current_user.music_pref == 'neutral' %}selected{% endif %}>Не важно</option>
                            <option value="love" {% if current_user.music_pref == 'love' %}selected{% endif %}>Люблю музыку</option>
                            <option value="no" {% if current_user.music_pref == 'no' %}selected{% endif %}>Без музыки</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="talk_pref" class="form-label">Разговорчивость</label>
                        <select class="form-select" id="talk_pref" name="talk_pref">
                            <option value="neutral" {% if current_user.talk_pref == 'neutral' %}selected{% endif %}>Не важно</option>
                            <option value="talk" {% if current_user.talk_pref == 'talk' %}selected{% endif %}>Люблю поболтать</option>
                            <option value="silence" {% if current_user.talk_pref == 'silence' %}selected{% endif %}>Предпочитаю тишину</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="ac_pref" class="form-label">Кондиционер</label>
                        <select class="form-select" id="ac_pref" name="ac_pref">
                            <option value="no_matter" {% if current_user.ac_pref == 'no_matter' %}selected{% endif %}>Не важно</option>
                            <option value="must" {% if current_user.ac_pref == 'must' %}selected{% endif %}>Обязательно</option>
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="smoking" name="smoking" {% if current_user.smoking %}checked{% endif %}>
                        <label class="form-check-label" for="smoking">Курение допускается</label>
                    </div>

                    <hr>
                    <h5>QWL ограничения (для водителей)</h5>
                    <div class="mb-3">
                        <label for="max_daily_hours" class="form-label">Макс. часов вождения в день</label>
                        <input type="number" class="form-control" id="max_daily_hours" name="max_daily_hours" step="0.5" min="1" max="12" value="{{ current_user.max_daily_hours }}">
                    </div>
                    <div class="mb-3">
                        <label for="break_interval_min" class="form-label">Интервал отдыха (минуты)</label>
                        <input type="number" class="form-control" id="break_interval_min" name="break_interval_min" min="15" max="180" value="{{ current_user.break_interval_min }}">
                    </div>

                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </form>
            </div>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Экстренные контакты</h5>
            </div>
            <div class="card-body">
                <p class="text-muted">Добавьте контакты для экстренных уведомлений (SOS).</p>
                <form method="POST" action="{{ url_for('emergency.add_contact') }}">
                    <div class="row mb-2">
                        <div class="col-4">
                            <select class="form-select" name="contact_type">
                                <option value="phone">Телефон</option>
                                <option value="telegram">Telegram</option>
                                <option value="email">Email</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <input type="text" class="form-control" name="contact_value" placeholder="+7...">
                        </div>
                        <div class="col-2">
                            <button type="submit" class="btn btn-sm btn-success">+</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
