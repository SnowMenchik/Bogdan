{% extends "base.html" %}
{% block title %}Подтверждение email — Попутка ИИ{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title text-center mb-4">Подтверждение email</h2>
                <p class="text-muted text-center">Введите код, отправленный на ваш email.</p>
                {% if mock_code %}
                    <div class="alert alert-info text-center">
                        <strong>Mock код:</strong> {{ mock_code }}
                    </div>
                {% endif %}
                <form method="POST" action="{{ url_for('auth.verify') }}">
                    <div class="mb-3">
                        <label for="code" class="form-label">Код подтверждения</label>
                        <input type="text" class="form-control" id="code" name="code" required maxlength="10">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Подтвердить</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
